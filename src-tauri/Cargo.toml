[package]
name = "worktodo"
version = "0.4.0"
description = "工作待办 — lightweight work todo app"
authors = ["workTodo"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "worktodo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
