# 打包发布：推送 vX.Y.Z 标签 → 测试 → 生成更新日志并创建草稿 Release →
# 三平台并行构建、上传安装包到草稿 → 校验资产齐全后统一转正式发布。
# 手动触发（workflow_dispatch）则只构建，安装包上传为 artifacts，不建 Release。
#
# 应用内「检查更新」读取 releases/latest（不含 draft / prerelease）。草稿 →
# 统一转正的两段式发布保证 releases/latest 永远不会指向缺安装包的半成品
# （某个平台构建失败时 Release 停留在草稿，删掉重试即可）。资产保持 Tauri
# 默认命名（*-setup.exe / .dmg / .AppImage / .deb），src/core/update.js
# 按文件后缀挑选下载目标，不要在上传时改名。
#
# 桌面端应用内更新（plugin:updater）依赖 Release 里的 latest.json 签名清单：
# 构建时用 secrets TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# 签名，运行端公钥在 src-tauri/tauri.conf.json plugins.updater.pubkey。
# 私钥丢失 = 存量桌面用户收不到应用内更新，只能回退浏览器下载。

name: 打包发布

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: 测试与版本校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 单元 + 组件测试
        run: npm test
      # E2E 跑构建后的 dist/（真实 Chromium），是最强的回归防线，必须挡在
      # 打包前。用例内已拦截 api.github.com，无需外网。
      - name: 安装 e2e 用 Chromium
        run: npx playwright-core install chromium --with-deps
      - name: E2E 测试（构建 dist + 真实 Chromium）
        run: npm run test:e2e
      # AGENTS.md 契约：版本号唯一源头是 src-tauri/Cargo.toml，tag 必须与之一致，
      # 否则应用内版本比较与 releases/latest 对不上。
      - name: 校验 tag 与版本号一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e '
            const fs = require("fs");
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const version = fs.readFileSync("./src-tauri/Cargo.toml", "utf8").match(/^version = "([^"]+)"/m)[1];
            if (version !== tag) {
              console.error("src-tauri/Cargo.toml 版本 " + version + " 与 tag " + tag + " 不一致，请升版后重新打 tag（见 docs/BUILD.md 发布流程）。");
              process.exit(1);
            }
            console.log("Cargo.toml 版本与 tag 一致：v" + tag);
          '

  prepare:
    name: 生成更新日志并创建草稿 Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create_draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 更新日志需要完整提交历史与历史标签
      # 更新日志按 conventional commits 分组（feat / fix / perf），开发类提交
      # （chore / docs / test / ci …）不出现在用户面前；末尾追加的下载指引
      # 只面向 GitHub 页面访客，应用内弹窗会把它裁掉（core/update.js
      # trimReleaseNotes），两边互不干扰。
      - name: 生成更新日志
        id: changelog
        shell: bash
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            SUBJECTS=$(git log --no-merges --pretty=format:'%s' "$PREV..HEAD")
          else
            SUBJECTS=$(git log --no-merges -n 30 --pretty=format:'%s')
          fi
          group() {
            printf '%s\n' "$SUBJECTS" \
              | grep -iE "^$1(\([^)]*\))?(!)?:" \
              | sed -E "s/^$1(\([^)]*\))?(!)?:[[:space:]]*//I" \
              | sed 's/^/- /' || true
          }
          FEATS=$(group feat)
          FIXES=$(group fix)
          PERFS=$(group perf)
          {
            echo 'body<<WORK_TODO_EOF'
            if [ -n "$FEATS" ] || [ -n "$FIXES" ] || [ -n "$PERFS" ]; then
              [ -n "$FEATS" ] && printf '新功能\n%s\n\n' "$FEATS"
              [ -n "$FIXES" ] && printf '问题修复\n%s\n\n' "$FIXES"
              [ -n "$PERFS" ] && printf '体验优化\n%s\n\n' "$PERFS"
            else
              printf '维护性更新。\n\n'
            fi
            echo '---'
            echo '下载：Windows 选 `*-setup.exe`；macOS 选 `.dmg`（通用二进制，未签名，首次打开请右键 → 打开）；Linux 选 `.AppImage` / `.deb` / `.rpm`。'
            echo 'WORK_TODO_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: 创建草稿 Release
        id: create_draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BODY: ${{ steps.changelog.outputs.body }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ID=$(gh api --method POST "repos/${{ github.repository }}/releases" \
            -f tag_name="${GITHUB_REF_NAME}" \
            -f name="work-todo v${VERSION}" \
            -f body="$RELEASE_BODY" \
            -F draft=true -F prerelease=false \
            --jq '.id')
          echo "release_id=$ID" >> "$GITHUB_OUTPUT"

  build:
    name: 构建安装包（${{ matrix.platform }}）
    needs: [test, prepare]
    # prepare 仅 tag 推送时存在；手动触发时被跳过也要继续构建（只出 artifacts）
    if: ${{ !failure() && !cancelled() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 构建通用二进制（同时含 Intel / Apple Silicon），dmg 资产名形如
          # work-todo_x.y.z_universal.dmg，仍是 update.js 认得的 .dmg。
          - platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: '--target universal-apple-darwin'
            artifacts: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          # ubuntu-22.04 提供 webkit2gtk-4.1；若该镜像被 GitHub 下线可改 ubuntu-latest。
          - platform: ubuntu-22.04
            rust-targets: ''
            args: ''
            artifacts: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/appimage/*.AppImage
          # Windows 只出 NSIS setup.exe，不再构建 MSI（WiX 打包省约半分钟）；
          # 发布校验与 src/core/update.js 均按后缀挑选，无其它改动。
          - platform: windows-latest
            rust-targets: ''
            args: '--bundles nsis'
            artifacts: src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-bin
      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      # 只读缓存：tag 触发的运行写入的缓存被 GitHub 限定在该 tag 的 ref 作用域
      # 内，下一次发版（新 tag）永远读不到——这是过去每次发版都全量冷编译约
      # 500 个依赖的原因。真正落缓存的是 rust-cache-warm.yml 在 main 分支上的
      # 预热构建；shared-key 必须与它保持一致才能对上 key，save-if 关掉以免
      # 继续往各 tag 作用域写无效缓存。
      - name: 缓存 Rust 编译产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release
          save-if: "false"
      - name: 安装前端依赖
        run: npm ci
      # tag 推送：上传到 prepare 建好的草稿 Release（只上传，不改变草稿状态）；
      # 手动触发：releaseId 为空，只构建不关联任何 Release。
      # 签名私钥（minisign）来自仓库 secrets——应用内更新按 tauri.conf.json 里的
      # 公钥校验签名；两个 secret 未配置时带 latest.json 的构建会直接失败（见
      # docs/BUILD.md「应用内更新」）。
      # 预检放在构建前：secret 为空时 tauri 的真实报错是「incorrect updater
      # private key password: Missing comment in secret key」（解码失败被统一
      # 包装成密码错误，无法定位），且要等矩阵构建近尾声才炸；这里秒级失败并
      # 给出可操作的提示。私钥本体是 src-tauri/keys/work-todo-updater.key 的
      # 完整单行内容（base64 形式，tauri 构建时先 base64 解码再解析 minisign
      # 密钥），见 docs/BUILD.md「应用内更新」。
      - name: 检查更新签名私钥 secret
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          node -e '
            const key = (process.env.TAURI_SIGNING_PRIVATE_KEY || "").trim();
            if (!key) {
              console.error("::error::secret TAURI_SIGNING_PRIVATE_KEY 未配置或为空——应用内更新需要 minisign 私钥签名 latest.json。请把 src-tauri/keys/work-todo-updater.key 的完整单行内容填入仓库 secrets（见 docs/BUILD.md「应用内更新」）。");
              process.exit(1);
            }
            const decoded = Buffer.from(key, "base64").toString("utf8");
            if (!decoded.startsWith("untrusted comment:")) {
              console.error("::error::TAURI_SIGNING_PRIVATE_KEY 不是有效的 minisign 私钥（应为 src-tauri/keys/work-todo-updater.key 文件的完整内容，base64 形式的单行字符串）。内容不对时 tauri 构建会报「Missing comment in secret key」。");
              process.exit(1);
            }
            console.log("TAURI_SIGNING_PRIVATE_KEY 已配置且格式合法（minisign 私钥）。");
          '
      - name: 构建并上传安装包到草稿 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ startsWith(github.ref, 'refs/tags/') && needs.prepare.outputs.release_id || '' }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}
      - name: 上传安装包 artifacts（手动触发时）
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: work-todo-${{ matrix.platform }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  publish:
    name: 校验资产并发布 Release
    if: ${{ startsWith(github.ref, 'refs/tags/') && !failure() && !cancelled() }}
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 与 src/core/update.js pickDownloadUrl 的挑选规则保持一致：
      # Windows 任一 exe/msi、macOS dmg、Linux AppImage 或 deb；另需 latest.json
      # （应用内更新的签名清单）。缺资产即失败，Release 停留在草稿，不会被
      # releases/latest 暴露。
      - name: 校验安装包资产齐全
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          ASSETS=$(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID/assets" --paginate --jq '.[].name')
          echo "草稿 Release 资产："
          echo "$ASSETS"
          check() {
            echo "$ASSETS" | grep -Eq "$1" || { echo "::error::安装包资产不齐全：$2"; exit 1; }
          }
          check '\.exe$' 'Windows（*-setup.exe）'
          check '\.dmg$' 'macOS（.dmg）'
          check '\.AppImage$|\.deb$' 'Linux（.AppImage / .deb）'
          check '^latest\.json$' 'latest.json（应用内更新的签名清单）'
      - name: 发布 Release（草稿转正式）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: gh api --method PATCH "repos/${{ github.repository }}/releases/$RELEASE_ID" -F draft=false
      - name: 确认 releases/latest 已指向新版
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3 4 5; do
            TAG=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name 2>/dev/null || true)
            if [ "$TAG" = "${GITHUB_REF_NAME}" ]; then
              echo "releases/latest → $TAG，应用内「检查更新」即可发现新版。"
              exit 0
            fi
            sleep 5
          done
          echo "::error::releases/latest 未指向 ${GITHUB_REF_NAME}，请人工检查 Release 状态。"
          exit 1
