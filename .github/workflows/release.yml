# 打包发布：推送 vX.Y.Z 标签 → 跑测试 → 三平台（Windows / macOS / Linux）
# 并行编译安装包并发布 GitHub Release；手动触发（workflow_dispatch）则只构建，
# 把安装包上传为 artifacts，不发布 Release。
#
# 应用内「检查更新」读取 releases/latest（不含 draft / prerelease），因此 Release
# 直接发布；资产保持 Tauri 默认命名（*-setup.exe / .msi / .dmg / .AppImage / .deb），
# src/lib/update.js 按文件后缀挑选下载目标，不要在上传时改名。

name: 打包发布

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: 测试与版本校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 单元 + 组件测试
        run: npm test
      # AGENTS.md 契约：版本号唯一源头是 src-tauri/Cargo.toml，tag 必须与之一致，
      # 否则应用内版本比较与 releases/latest 对不上。
      - name: 校验 tag 与版本号一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e '
            const fs = require("fs");
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const version = fs.readFileSync("./src-tauri/Cargo.toml", "utf8").match(/^version = "([^"]+)"/m)[1];
            if (version !== tag) {
              console.error("src-tauri/Cargo.toml 版本 " + version + " 与 tag " + tag + " 不一致，请升版后重新打 tag（见 docs/BUILD.md 发布流程）。");
              process.exit(1);
            }
            console.log("Cargo.toml 版本与 tag 一致：v" + tag);
          '

  build:
    name: 构建安装包（${{ matrix.platform }}）
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 构建通用二进制（同时含 Intel / Apple Silicon），dmg 资产名形如
          # WorkTodo_x.y.z_universal.dmg，仍是 update.js 认得的 .dmg。
          - platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: '--target universal-apple-darwin'
            artifacts: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          # ubuntu-22.04 提供 webkit2gtk-4.1；若该镜像被 GitHub 下线可改 ubuntu-latest。
          - platform: ubuntu-22.04
            rust-targets: ''
            args: ''
            artifacts: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/appimage/*.AppImage
          - platform: windows-latest
            rust-targets: ''
            args: ''
            artifacts: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 生成 Release 更新日志需要完整提交历史与历史标签
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-bin
      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - name: 缓存 Rust 编译产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 安装前端依赖
        run: npm ci
      - name: 生成 Release 更新日志
        if: startsWith(github.ref, 'refs/tags/')
        id: changelog
        shell: bash # run 默认在 Windows 上用 PowerShell，本步骤是 bash 语法
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          {
            echo 'body<<WORKTODO_EOF'
            if [ -n "$PREV" ]; then
              git log --no-merges --pretty=format:'- %s' "$PREV"..HEAD
            else
              git log --no-merges -n 30 --pretty=format:'- %s'
            fi
            echo ''
            echo ''
            echo '---'
            echo '下载：Windows 选 `.msi` 或 `*-setup.exe`；macOS 选 `.dmg`（通用二进制，未签名，首次打开请右键 → 打开）；Linux 选 `.AppImage` / `.deb` / `.rpm`。'
            echo 'WORKTODO_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: 构建并发布 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 仅 tag 推送时创建并发布 Release；手动触发时为空，只构建不发布
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'WorkTodo v__VERSION__'
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
      - name: 上传安装包 artifacts（手动触发时）
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: WorkTodo-${{ matrix.platform }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
