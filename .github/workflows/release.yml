# 打包发布：推送 vX.Y.Z 标签 → 测试 → 生成更新日志并创建草稿 Release →
# 三平台并行构建、上传安装包到草稿 → 校验资产齐全后统一转正式发布。
# 手动触发（workflow_dispatch）则只构建，安装包上传为 artifacts，不建 Release。
#
# 应用内「检查更新」读取 releases/latest（不含 draft / prerelease）。草稿 →
# 统一转正的两段式发布保证 releases/latest 永远不会指向缺安装包的半成品
# （某个平台构建失败时 Release 停留在草稿，删掉重试即可）。资产保持 Tauri
# 默认命名（*-setup.exe / .msi / .dmg / .AppImage / .deb），src/core/update.js
# 按文件后缀挑选下载目标，不要在上传时改名。

name: 打包发布

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: 测试与版本校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 单元 + 组件测试
        run: npm test
      # AGENTS.md 契约：版本号唯一源头是 src-tauri/Cargo.toml，tag 必须与之一致，
      # 否则应用内版本比较与 releases/latest 对不上。
      - name: 校验 tag 与版本号一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e '
            const fs = require("fs");
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const version = fs.readFileSync("./src-tauri/Cargo.toml", "utf8").match(/^version = "([^"]+)"/m)[1];
            if (version !== tag) {
              console.error("src-tauri/Cargo.toml 版本 " + version + " 与 tag " + tag + " 不一致，请升版后重新打 tag（见 docs/BUILD.md 发布流程）。");
              process.exit(1);
            }
            console.log("Cargo.toml 版本与 tag 一致：v" + tag);
          '

  prepare:
    name: 生成更新日志并创建草稿 Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create_draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 更新日志需要完整提交历史与历史标签
      # 更新日志按 conventional commits 分组（feat / fix / perf），开发类提交
      # （chore / docs / test / ci …）不出现在用户面前；末尾追加的下载指引
      # 只面向 GitHub 页面访客，应用内弹窗会把它裁掉（core/update.js
      # trimReleaseNotes），两边互不干扰。
      - name: 生成更新日志
        id: changelog
        shell: bash
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            SUBJECTS=$(git log --no-merges --pretty=format:'%s' "$PREV..HEAD")
          else
            SUBJECTS=$(git log --no-merges -n 30 --pretty=format:'%s')
          fi
          group() {
            printf '%s\n' "$SUBJECTS" \
              | grep -iE "^$1(\([^)]*\))?(!)?:" \
              | sed -E "s/^$1(\([^)]*\))?(!)?:[[:space:]]*//I" \
              | sed 's/^/- /' || true
          }
          FEATS=$(group feat)
          FIXES=$(group fix)
          PERFS=$(group perf)
          {
            echo 'body<<WORK_TODO_EOF'
            if [ -n "$FEATS" ] || [ -n "$FIXES" ] || [ -n "$PERFS" ]; then
              [ -n "$FEATS" ] && printf '新功能\n%s\n\n' "$FEATS"
              [ -n "$FIXES" ] && printf '问题修复\n%s\n\n' "$FIXES"
              [ -n "$PERFS" ] && printf '体验优化\n%s\n\n' "$PERFS"
            else
              printf '维护性更新。\n\n'
            fi
            echo '---'
            echo '下载：Windows 选 `*-setup.exe` 或 `.msi`；macOS 选 `.dmg`（通用二进制，未签名，首次打开请右键 → 打开）；Linux 选 `.AppImage` / `.deb` / `.rpm`。'
            echo 'WORK_TODO_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: 创建草稿 Release
        id: create_draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BODY: ${{ steps.changelog.outputs.body }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ID=$(gh api --method POST "repos/${{ github.repository }}/releases" \
            -f tag_name="${GITHUB_REF_NAME}" \
            -f name="work-todo v${VERSION}" \
            -f body="$RELEASE_BODY" \
            -F draft=true -F prerelease=false \
            --jq '.id')
          echo "release_id=$ID" >> "$GITHUB_OUTPUT"

  build:
    name: 构建安装包（${{ matrix.platform }}）
    needs: [test, prepare]
    # prepare 仅 tag 推送时存在；手动触发时被跳过也要继续构建（只出 artifacts）
    if: ${{ !failure() && !cancelled() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 构建通用二进制（同时含 Intel / Apple Silicon），dmg 资产名形如
          # work-todo_x.y.z_universal.dmg，仍是 update.js 认得的 .dmg。
          - platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: '--target universal-apple-darwin'
            artifacts: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          # ubuntu-22.04 提供 webkit2gtk-4.1；若该镜像被 GitHub 下线可改 ubuntu-latest。
          - platform: ubuntu-22.04
            rust-targets: ''
            args: ''
            artifacts: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/appimage/*.AppImage
          - platform: windows-latest
            rust-targets: ''
            args: ''
            artifacts: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-bin
      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - name: 缓存 Rust 编译产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 安装前端依赖
        run: npm ci
      # tag 推送：上传到 prepare 建好的草稿 Release（只上传，不改变草稿状态）；
      # 手动触发：releaseId 为空，只构建不关联任何 Release。
      - name: 构建并上传安装包到草稿 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ startsWith(github.ref, 'refs/tags/') && needs.prepare.outputs.release_id || '' }}
          args: ${{ matrix.args }}
      - name: 上传安装包 artifacts（手动触发时）
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: work-todo-${{ matrix.platform }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  publish:
    name: 校验资产并发布 Release
    if: ${{ startsWith(github.ref, 'refs/tags/') && !failure() && !cancelled() }}
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 与 src/core/update.js pickDownloadUrl 的挑选规则保持一致：
      # Windows 任一 exe/msi、macOS dmg、Linux AppImage 或 deb。缺资产即失败，
      # Release 停留在草稿，不会被 releases/latest 暴露。
      - name: 校验安装包资产齐全
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          ASSETS=$(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID/assets" --paginate --jq '.[].name')
          echo "草稿 Release 资产："
          echo "$ASSETS"
          check() {
            echo "$ASSETS" | grep -Eq "$1" || { echo "::error::安装包资产不齐全：$2"; exit 1; }
          }
          check '-setup\.exe$|\.exe$|\.msi$' 'Windows（*-setup.exe / .msi）'
          check '\.dmg$' 'macOS（.dmg）'
          check '\.AppImage$|\.deb$' 'Linux（.AppImage / .deb）'
      - name: 发布 Release（草稿转正式）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: gh api --method PATCH "repos/${{ github.repository }}/releases/$RELEASE_ID" -F draft=false
      - name: 确认 releases/latest 已指向新版
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3 4 5; do
            TAG=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name 2>/dev/null || true)
            if [ "$TAG" = "${GITHUB_REF_NAME}" ]; then
              echo "releases/latest → $TAG，应用内「检查更新」即可发现新版。"
              exit 0
            fi
            sleep 5
          done
          echo "::error::releases/latest 未指向 ${GITHUB_REF_NAME}，请人工检查 Release 状态。"
          exit 1
