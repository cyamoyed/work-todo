# 版本号防漂移：main 分支出现新提交但 src-tauri/Cargo.toml 版本号还没升时，
# 在 Actions 页面和 commit 状态上挂一条提醒（warning，不阻断合入/推送）。
# 真正的硬校验（tag 必须等于 Cargo.toml 版本）由 release.yml 负责。

name: 版本号防漂移

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  remind:
    name: 检查 main 版本号
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: 比较 Cargo.toml 与最新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p 'require("fs").readFileSync("src-tauri/Cargo.toml","utf8").match(/^version = "([^"]+)"/m)[1]')
          LATEST=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [ -z "$LATEST" ]; then
            echo "仓库还没有正式 Release，跳过。"
            exit 0
          fi
          COUNT=$(git rev-list --count "${LATEST}..HEAD" 2>/dev/null || echo 0)
          if [ "$COUNT" -eq 0 ]; then
            echo "main 与 $LATEST 一致，无新提交，无需升版。"
            exit 0
          fi
          if [ "v$VERSION" = "$LATEST" ]; then
            echo "::warning file=src-tauri/Cargo.toml::main 已有 $COUNT 个新提交，但版本号仍是 $VERSION（最新 Release 为 $LATEST）。发版前记得升版（见 docs/BUILD.md 发布流程）。"
          else
            echo "版本号已升到 v$VERSION（最新 Release $LATEST），OK。"
          fi
