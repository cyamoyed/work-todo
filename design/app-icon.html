<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>work-todo · 图标源</title>
<style>
  body {
    margin: 0; min-height: 100vh; background: #fafafa; color: #18181b;
    display: flex; flex-direction: column; gap: 40px;
    align-items: center; justify-content: center;
    font: 13px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  .band { display: flex; align-items: flex-end; gap: 28px; padding: 24px; border-radius: 14px; }
  .band.dark { background: #18181b; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .cell span { font-size: 11px; color: #71717a; }
  canvas { display: block; }
</style>
</head>
<body>
  <div class="band" id="light"></div>
  <div class="band dark" id="dark"></div>
<script>
// work-todo 应用图标源 —— 设计「纸面三色清单」:
// 暖米纸底(无蓝紫、无渐变、无发光),首行绿色实心圆 + 白勾 = 已完成;
// 二、三行琥珀 / 朱红描边空圆 = 待办,墨色圆角横条,第三条略短。
// 语言参考 Apple Reminders 的多彩清单;消费方:design/export-icon.js 调 window.renderToDataURL(px)。
const C = {
  bg: '#F4EDDE',      // 暖米纸
  green: '#27A566',   // 已完成
  amber: '#F59E1B',   // 待办
  vermilion: '#E8502E', // 待办
  ink: '#26221B',     // 横条(暖墨)
  white: '#FFFFFF',
};

// 以下几何常量均以 1024 画布为基准,按 size 等比缩放
const G = {
  corner: 232,          // 圆角半径(≈22.7%,接近 iOS 方圆比)
  dotD: 168,            // 圆控件直径
  dotCx: 316,           // 圆控件圆心 x
  dotCy: [244, 512, 780], // 三行圆心 y
  barX: 492,            // 横条起点 x
  barH: 64,             // 横条高(全圆角)
  barLen: [328, 328, 200], // 三条横条长,末条略短
  ringStroke: 26,       // 空心圆描边
  checkStroke: 34,      // 对勾笔画
};

function roundRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawIcon(ctx, size) {
  const s = size / 1024;
  ctx.clearRect(0, 0, size, size);

  // 底:圆角方块,透明圆角之外
  roundRectPath(ctx, 0, 0, size, size, G.corner * s);
  ctx.fillStyle = C.bg;
  ctx.fill();

  // 三行清单
  for (let i = 0; i < 3; i++) {
    const cy = G.dotCy[i] * s;
    const cx = G.dotCx * s;
    const r = (G.dotD / 2) * s;

    if (i === 0) {
      // 首行:绿色实心圆 + 白勾 = 已完成
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = C.green;
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(cx - 48 * s, cy + 2 * s);
      ctx.lineTo(cx - 12 * s, cy + 40 * s);
      ctx.lineTo(cx + 48 * s, cy - 42 * s);
      ctx.strokeStyle = C.white;
      ctx.lineWidth = G.checkStroke * s;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke();
    } else {
      // 待办行:琥珀 / 朱红描边空圆
      ctx.beginPath();
      ctx.arc(cx, cy, r - (G.ringStroke / 2) * s, 0, Math.PI * 2);
      ctx.strokeStyle = i === 1 ? C.amber : C.vermilion;
      ctx.lineWidth = G.ringStroke * s;
      ctx.stroke();
    }

    // 墨色圆角横条
    const bx = G.barX * s;
    const bw = G.barLen[i] * s;
    const bh = G.barH * s;
    roundRectPath(ctx, bx, cy - bh / 2, bw, bh, bh / 2);
    ctx.fillStyle = C.ink;
    ctx.fill();
  }
}

// 供 design/export-icon.js 调用:离屏渲染指定尺寸,返回 PNG dataURL
window.renderToDataURL = function (px) {
  const canvas = document.createElement('canvas');
  canvas.width = px;
  canvas.height = px;
  drawIcon(canvas.getContext('2d'), px);
  return canvas.toDataURL('image/png');
};

// 页面预览:亮/暗两种底,从 512 到 16 检查小尺寸可读性
for (const [id, sizes] of [
  ['light', [512, 256, 128, 64]],
  ['dark', [48, 32, 24, 16]],
]) {
  const host = document.getElementById(id);
  for (const px of sizes) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    const canvas = document.createElement('canvas');
    canvas.width = px;
    canvas.height = px;
    drawIcon(canvas.getContext('2d'), px);
    cell.appendChild(canvas);
    const label = document.createElement('span');
    label.textContent = px + 'px';
    cell.appendChild(label);
    host.appendChild(cell);
  }
}
</script>
</body>
</html>
