<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>工作待办 · WorkTodo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <h1>工作待办</h1>
      </div>
      <div class="search-wrap">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <path d="M11 11l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <input id="search-input" type="search" placeholder="搜索任务标题…" autocomplete="off" />
      </div>
      <button id="btn-new" class="btn btn-primary" type="button">＋ 新建任务</button>
    </header>

    <section class="filters" aria-label="筛选">
      <div class="filter-group">
        <span class="filter-label">状态</span>
        <div class="segmented" id="status-filter" role="group" aria-label="状态筛选">
          <button type="button" data-value="all" class="active">全部</button>
          <button type="button" data-value="todo">待办</button>
          <button type="button" data-value="in-progress">进行中</button>
          <button type="button" data-value="done">已完成</button>
        </div>
      </div>
      <div class="filter-group">
        <span class="filter-label">优先级</span>
        <div class="segmented" id="priority-filter" role="group" aria-label="优先级筛选">
          <button type="button" data-value="all" class="active">全部</button>
          <button type="button" data-value="high">高</button>
          <button type="button" data-value="medium">中</button>
          <button type="button" data-value="low">低</button>
        </div>
      </div>
    </section>

    <div id="error-banner" class="error-banner" hidden role="alert"></div>

    <section id="task-list" class="task-list" aria-live="polite"></section>

    <footer class="footer">
      <span id="task-stats"></span>
    </footer>
  </div>

  <div id="modal-backdrop" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title">新建任务</h2>
      <form id="task-form" novalidate>
        <label class="field">
          <span class="field-label">标题</span>
          <input id="field-title" name="title" type="text" maxlength="120" placeholder="要做什么？" autocomplete="off" />
          <span class="field-error" id="title-error" hidden>标题不能为空</span>
        </label>

        <div class="field-row">
          <label class="field">
            <span class="field-label">状态</span>
            <select id="field-status" name="status">
              <option value="todo">待办</option>
              <option value="in-progress">进行中</option>
              <option value="done">已完成</option>
            </select>
          </label>

          <label class="field">
            <span class="field-label">优先级</span>
            <select id="field-priority" name="priority">
              <option value="high">高</option>
              <option value="medium" selected>中</option>
              <option value="low">低</option>
            </select>
          </label>

          <label class="field">
            <span class="field-label">截止日期</span>
            <div class="date-row">
              <input id="field-due" name="dueDate" type="date" />
              <button type="button" id="btn-clear-date" class="btn btn-ghost" title="清除日期">清除</button>
            </div>
          </label>
        </div>

        <div class="modal-actions">
          <button type="button" id="btn-cancel" class="btn btn-ghost">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <div id="confirm-backdrop" class="modal-backdrop" hidden>
    <div class="modal modal-sm" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
      <h2 id="confirm-title">删除任务</h2>
      <p id="confirm-message">确定删除该任务吗？删除后无法恢复。</p>
      <div class="modal-actions">
        <button type="button" id="btn-confirm-cancel" class="btn btn-ghost">取消</button>
        <button type="button" id="btn-confirm-ok" class="btn btn-danger">删除</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
